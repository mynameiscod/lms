services:
  mongodb:
    image: mongo:latest
    container_name: lms-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lms-saas
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    networks:
      - lms-network
    restart: unless-stopped

  server-blue:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lms-server-blue
    ports:
      - "5001:5000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      NODE_ENV: production
      FRONTEND_URL: https://platform.codebegun.com
      PISTON_URL: http://piston:2000/api/v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - piston
      - redis
    networks:
      - lms-network
    restart: unless-stopped

  server-green:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lms-server-green
    ports:
      - "5002:5000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      NODE_ENV: production
      FRONTEND_URL: https://platform.codebegun.com
      PISTON_URL: http://piston:2000/api/v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - piston
      - redis
    networks:
      - lms-network
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: lms-piston
    privileged: true
    tmpfs:
      - /piston/jobs:exec,size=256m
    volumes:
      - piston_data:/piston/packages
    environment:
      # Generous limits: Java compiles inside the run stage and cold javac+JVM
      # can use ~13-14s CPU just to start, so 15s was too tight and correct code
      # got SIGKILLed ("Killed"). 30s run / 20s compile gives comfortable headroom.
      PISTON_RUN_TIMEOUT: "30000"
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_RUN_CPU_TIME: "30000"
      PISTON_COMPILE_CPU_TIME: "20000"
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  mongodb_data:
  uploads_data:
  piston_data:
  redis_data:

networks:
  lms-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.18.0.0/16"
        - subnet: "fd3a::/80"