upstream lms_backend {
    include /etc/nginx/active-slot.conf;
}

server {
    server_name platform.codebegun.com www.platform.codebegun.com;

    location / {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;

        # Keep connections alive to active slot
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/platform.codebegun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.codebegun.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name platform.codebegun.com www.platform.codebegun.com;
    return 301 https://$host$request_uri;
}
