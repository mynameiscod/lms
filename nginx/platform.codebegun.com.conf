upstream lms_backend {
    include /etc/nginx/active-slot.conf;
}

server {
    server_name platform.codebegun.com www.platform.codebegun.com;

    # A WhatsApp template's dynamic url button APPENDS its parameter to the base url
    # rather than substituting the placeholder, so exam links go out as
    # /battles/exam/{{1}}<token> and 404. This strips the stray placeholder.
    #
    # It is not hypothetical tidiness: 315 students tapped a dead link in ten minutes
    # an hour before the NEC battle opened. Editing the template in Meta needs
    # re-approval and does nothing for the messages already delivered — this repairs
    # those in flight. Kept even after the template is corrected, because the broken
    # messages live in people's chat history indefinitely.
    #
    # Matches the SPA route and /api/v1/public/battles/exam/... alike.
    rewrite "^(.*/battles/exam/)\{\{1\}\}(.+)$" $1$2 last;

    location / {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 1200M;   # Resource Library uploads (~1 GB files)

        # Keep connections alive to active slot; long timeouts for large uploads
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/platform.codebegun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.codebegun.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name platform.codebegun.com www.platform.codebegun.com;
    return 301 https://$host$request_uri;
}
