# ─────────────────────────────────────────────────────────────────────────────
# SECURITY NOTE (2026-08-07, after the second cryptominer compromise)
#
# Every `ports:` entry below is bound to 127.0.0.1 ON PURPOSE. A bare
# "6379:6379" binds 0.0.0.0 and — critically — Docker writes that rule into the
# DOCKER iptables chain, which is evaluated BEFORE the INPUT chain that ufw
# manages. So `ufw deny 6379` does NOT close a Docker-published port. The only
# reliable fixes are binding to 127.0.0.1 (here) and the DOCKER-USER rules in
# scripts/harden-firewall.sh. Do not "simplify" these back to "PORT:PORT".
#
# Reaching Mongo/Redis from your laptop is done with an SSH tunnel, never by
# republishing the port. See docs/runbooks/vps-recovery-hardening.md.
#
# Credentials come from /root/lms/.env (compose-level). There are NO fallback
# defaults — compose must fail loudly rather than silently boot with a password
# that is public in git history.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mongodb:
    image: mongo:latest
    container_name: lms-mongodb
    # localhost-only. Was 0.0.0.0:27017 with admin/password123 until 2026-08-07.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in /root/lms/.env}
      # NOTE: MONGO_INITDB_* only applies when the data volume is EMPTY. On an
      # existing volume this value is NOT applied — you must rotate the password
      # inside Mongo with db.changeUserPassword() first, then set it here, or the
      # app will fail to authenticate. The runbook does these in the right order.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in /root/lms/.env}
      MONGO_INITDB_DATABASE: lms-saas
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    # THIS was the reinfection vector: unauthenticated Redis on 0.0.0.0:6379 lets
    # a scanner CONFIG SET dir /var/spool/cron and write a root crontab. Now
    # localhost-only AND password-protected — either alone would have stopped it.
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in /root/lms/.env}
      - --protected-mode
      - "yes"
      # MODULE LOAD is an arbitrary-code-execution path and nothing here uses it.
      # CONFIG is deliberately NOT disabled even though CONFIG SET dir is the
      # exact command used in the attack: BullMQ calls CONFIG GET maxmemory-policy
      # on connect, so renaming it would take the AI call queue down. The attack
      # needs an unauthenticated connection, and requirepass + the localhost bind
      # + the DOCKER-USER drop each independently prevent that.
      - --rename-command
      - MODULE
      - ""
    volumes:
      - redis_data:/data
    networks:
      - lms-network
    restart: unless-stopped

  server-blue:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lms-server-blue
    # localhost-only: nginx is the only thing that should reach the app. Publishing
    # 0.0.0.0:5001 let anyone bypass nginx (and its TLS, rate limits and logging).
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in /root/lms/.env}
      # Set EXPLICITLY and kept SEPARATE from JWT_SECRET. settingsService falls
      # back to JWT_SECRET (then to a hardcoded string) when this is unset, which
      # means rotating JWT_SECRET would silently make every API key stored in
      # Platform Settings undecryptable. These two must rotate independently.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in /root/lms/.env}
      NODE_ENV: production
      FRONTEND_URL: https://platform.codebegun.com
      PISTON_URL: http://piston:2000/api/v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - piston
      - redis
    networks:
      - lms-network
    restart: unless-stopped

  server-green:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lms-server-green
    ports:
      - "127.0.0.1:5002:5000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in /root/lms/.env}
      # Set EXPLICITLY and kept SEPARATE from JWT_SECRET. settingsService falls
      # back to JWT_SECRET (then to a hardcoded string) when this is unset, which
      # means rotating JWT_SECRET would silently make every API key stored in
      # Platform Settings undecryptable. These two must rotate independently.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in /root/lms/.env}
      NODE_ENV: production
      FRONTEND_URL: https://platform.codebegun.com
      PISTON_URL: http://piston:2000/api/v2
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - piston
      - redis
    networks:
      - lms-network
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: lms-piston
    # `privileged: true` (used until 2026-08-07) gives this container effective
    # root on the HOST — and it runs arbitrary student-submitted code, so a
    # container escape is one published exploit away. Piston's sandbox needs
    # mount/cgroup namespaces, which is CAP_SYS_ADMIN, not the full privileged set.
    #
    # ⚠️ VERIFY code execution after deploying this (runbook step 7). If Piston
    # fails to run jobs, the fallback is `privileged: true` again — but treat that
    # as temporary and keep Piston off any public port either way.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /piston/jobs:exec,size=256m
    volumes:
      - piston_data:/piston/packages
    environment:
      # Generous limits: Java compiles inside the run stage and cold javac+JVM
      # can use ~13-14s CPU just to start, so 15s was too tight and correct code
      # got SIGKILLed ("Killed"). 30s run / 20s compile gives comfortable headroom.
      PISTON_RUN_TIMEOUT: "30000"
      PISTON_COMPILE_TIMEOUT: "20000"
      PISTON_RUN_CPU_TIME: "30000"
      PISTON_COMPILE_CPU_TIME: "20000"
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  mongodb_data:
  uploads_data:
  piston_data:
  redis_data:

networks:
  lms-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.18.0.0/16"
        - subnet: "fd3a::/80"
