global
    nbthread 1
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend local_ingress
    bind :8080
    default_backend mcp_app

backend mcp_app
    server app app:5000 check resolvers docker init-addr libc,none
