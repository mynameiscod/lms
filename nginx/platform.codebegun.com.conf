# ============================================================================
# platform.codebegun.com — THE source of truth for this vhost.
#
# Install it with:  bash scripts/install-nginx-conf.sh
#
# This file drifted from the running config between 22 and 24 September, because
# two rules were added live during the incident and never came back here. That is
# not a tidiness problem: nothing in the repository described what was actually
# serving traffic, so a host rebuild could not have restored it and nobody could
# review it in a diff. Both rules are now below, with the reason each exists.
#
# If you change nginx on the box, change it HERE and run the installer. The
# installer diffs against the live file first, so drift is visible before it is
# overwritten.
# ============================================================================

upstream lms_backend {
    # Written by deploy-image.sh at the blue/green flip. Not in version control
    # because it is deploy state, not configuration.
    include /etc/nginx/active-slot.conf;
}

server {
    server_name platform.codebegun.com www.platform.codebegun.com;

    # Meta's template button appends its parameter to the base url instead of
    # substituting it, so exam links arrive as /battles/exam/{{1}}<token> and 404.
    # Strip the stray placeholder so links already sitting in students' WhatsApp
    # work without waiting on a template edit + re-approval.
    #
    # Not hypothetical tidiness: 315 students tapped a dead link in ten minutes an
    # hour before the NEC battle opened. Kept even after the template is corrected,
    # because the broken messages live in people's chat history indefinitely.
    # Covers the SPA route and /api/v1/public/battles/exam/... alike.
    rewrite "^(.*/battles/exam/)\{\{1\}\}(.+)$" $1$2 last;

    # ── KILL SWITCH: proctoring chunk uploads ───────────────────────────────
    # Added live on 22 September. 15-second video chunks from 46 candidates
    # arrived faster than they uploaded, and that queue is what started the
    # outage. This is a hard stop in front of the app, independent of the admin
    # recording toggle, because the toggle cannot help if the app is the thing
    # that is drowning.
    #
    # COMMENT THIS OUT to re-enable uploads. It should stop being necessary once
    # chunks go direct to object storage instead of through the API; until then it
    # stays, in version control, where it can be found.
    location ~ "^/api/v1/public/hackathon-exams/attempt/[^/]+/recording/chunk$" {
        return 503;
    }

    # ── The React bundle, served by nginx rather than by Node ───────────────
    # Node served this at 5,198 B/s against nginx's 3.2 MB/s — a 615x difference,
    # and the reason candidates saw blank screens on 22 September. So nginx keeps
    # serving it.
    #
    # BUT: this directory is NOT the container's copy. It is a directory on the
    # host, and for two days it was a snapshot copied by hand during the incident.
    # Every deploy changes the bundle hash, index.html (served by the container)
    # then asks for a file this directory does not have, and the site goes blank
    # for everyone. It did not fire on 24 September only because two consecutive
    # deploys were server-side and webpack happened to emit an identical hash.
    #
    # deploy-image.sh now syncs this directory from the image it just started,
    # additively and before the traffic flip, so both the old and the new bundle
    # are present while the switch happens. If that sync fails the deploy aborts
    # rather than flipping into a blank site.
    #
    # Hashed filenames, so immutable caching is correct and safe here.
    location /static/ {
        alias /var/www/lms-static/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # If the sync ever does fall behind, fall through to the container rather
        # than returning a 404 that blanks the page. Slow beats broken.
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://lms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 1200M;   # Resource Library uploads (~1 GB files)

        # Keep connections alive to the active slot; long timeouts for large uploads.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/platform.codebegun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.codebegun.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name platform.codebegun.com www.platform.codebegun.com;
    return 301 https://$host$request_uri;
}
