# Managed by CodeBegun synthetic MCP staging.
server {
    listen 80;
    server_name mcp-test.codebegun.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/codebegun-mcp-test;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name mcp-test.codebegun.com;
    ssl_certificate /etc/letsencrypt/live/mcp-test.codebegun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-test.codebegun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    if ($host != mcp-test.codebegun.com) { return 444; }
    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host mcp-test.codebegun.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
