# ============================================
# Docker Compose for DEV Environment
# ============================================
# Same server as production, different ports
# DEV runs on port 5001, PROD on port 5000
# ============================================

services:
  mongodb:
    image: mongo:latest
    container_name: lms-dev-mongodb
    ports:
      - "27018:27017"  # Different port to avoid conflict with prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpassword123}
      MONGO_INITDB_DATABASE: lms-saas-dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - lms-dev-network
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-dev-server
    ports:
      - "5001:5000"    # Expose on 5001 externally, app listens on 5000
      - "3001:3000"    # Client dev port
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-devpassword123}@mongodb:27017/lms-saas-dev?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-not-for-production}
      NODE_ENV: development
      FRONTEND_URL: ${DEV_URL:-http://localhost:5001}
    volumes:
      - uploads_dev_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - lms-dev-network
    restart: unless-stopped

volumes:
  mongodb_dev_data:
    driver: local
  uploads_dev_data:
    driver: local

networks:
  lms-dev-network:
    driver: bridge
