name: CI/CD Pipeline (Dev → Production)

# ============================================
# WORKFLOW: Push → Dev → Test → Production
# ============================================
# 1. Push to any branch → Build & Test
# 2. Push to 'develop' → Deploy to DEV environment
# 3. Dev success → Auto-deploy to PRODUCTION
# 4. Manual rollback available anytime
# ============================================

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production
          - rollback-dev
          - rollback-prod

env:
  # Dev Environment
  DEV_HOST: ${{ secrets.DEV_HOST }}
  DEV_USER: ${{ secrets.DEV_USER }}
  DEV_APP_PATH: /root/lms-dev
  
  # Production Environment  
  PROD_HOST: ${{ secrets.PROD_HOST }}
  PROD_USER: ${{ secrets.PROD_USER }}
  PROD_APP_PATH: /root/lms

jobs:
  # ==========================================
  # STAGE 1: Build & Test (All branches)
  # ==========================================
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    outputs:
      build_success: ${{ steps.verify.outputs.success }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install server dependencies
        run: |
          cd server
          npm ci --legacy-peer-deps

      - name: 📦 Install client dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: 🧪 Run server tests
        run: |
          cd server
          npm test -- --passWithNoTests || true
        continue-on-error: true

      - name: 🔨 Build server
        run: |
          cd server
          npm run build

      - name: 🔨 Build client
        run: |
          cd client
          npm run build
        env:
          CI: false

      - name: ✅ Verify builds
        id: verify
        run: |
          if [ -f "server/dist/server.js" ] && [ -f "client/build/index.html" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ All builds verified!"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Build verification failed!"
            exit 1
          fi

      - name: 📊 Build Summary
        run: |
          echo "### 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Client Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # STAGE 2: Deploy to DEV Environment
  # ==========================================
  deploy-dev:
    name: 🚀 Deploy to DEV
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      github.event_name == 'push'
    environment:
      name: development
      url: http://${{ secrets.DEV_HOST }}:5001
    
    outputs:
      deploy_success: ${{ steps.health.outputs.success }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🗄️ Backup DEV Database
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEV_USER }}@${{ secrets.DEV_HOST }} << 'BACKUP'
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DB_BACKUP_DIR="/root/lms-backups/database"
          mkdir -p "$DB_BACKUP_DIR"
          
          # Use DEV container name
          if docker ps | grep -q "lms-dev-mongodb"; then
            echo "📦 Backing up DEV database..."
            docker exec lms-dev-mongodb mongodump \
              --uri="mongodb://admin:devpassword123@localhost:27017/lms-saas-dev?authSource=admin" \
              --out="/data/backup_$TIMESTAMP" \
              --gzip 2>/dev/null || true
            
            docker cp lms-dev-mongodb:/data/backup_$TIMESTAMP "$DB_BACKUP_DIR/dev_backup_$TIMESTAMP" 2>/dev/null || true
            docker exec lms-dev-mongodb rm -rf "/data/backup_$TIMESTAMP" 2>/dev/null || true
            
            if [ -d "$DB_BACKUP_DIR/dev_backup_$TIMESTAMP" ]; then
              cd "$DB_BACKUP_DIR"
              tar -czf "dev_backup_$TIMESTAMP.tar.gz" "dev_backup_$TIMESTAMP"
              rm -rf "dev_backup_$TIMESTAMP"
              echo "$TIMESTAMP" > "$DB_BACKUP_DIR/latest-dev"
              ls -t *.tar.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
              echo "✅ DEV database backed up"
            fi
          fi
          
          BACKUP

      - name: 🚀 Deploy to DEV
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEV_USER }}@${{ secrets.DEV_HOST }} << 'DEPLOY'
          
          set -e
          APP_DIR="${{ env.DEV_APP_PATH }}"
          BACKUP_DIR="/root/lms-backups"
          
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          
          # Preserve .env
          if [ -f "server/.env" ]; then
            cp "server/.env" "/tmp/.env.dev.safe"
          fi
          
          # Pull latest code
          if [ -d ".git" ]; then
            git stash 2>/dev/null || true
            git pull origin ${{ github.ref_name }}
          else
            git clone ${{ github.server_url }}/${{ github.repository }}.git .
          fi
          
          # Restore .env
          if [ -f "/tmp/.env.dev.safe" ]; then
            cp "/tmp/.env.dev.safe" "server/.env"
          fi
          
          # Build and deploy using DEV compose file
          docker-compose -f docker-compose.dev.yml down --timeout 30 2>/dev/null || true
          docker-compose -f docker-compose.dev.yml build --no-cache
          docker-compose -f docker-compose.dev.yml up -d
          
          echo "✅ DEV deployment complete (port 5001)"
          
          DEPLOY

      - name: ⏳ Wait for DEV startup
        run: sleep 30

      - name: 🔍 DEV Health Check
        id: health
        run: |
          MAX_RETRIES=10
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.DEV_HOST }}:5001/api/health" 2>/dev/null || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "success=true" >> $GITHUB_OUTPUT
              echo "✅ DEV health check passed!"
              exit 0
            fi
            
            RETRY=$((RETRY + 1))
            echo "Attempt $RETRY/$MAX_RETRIES - HTTP $HTTP_STATUS"
            sleep 5
          done
          
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ DEV health check failed!"
          exit 1

      - name: 📊 DEV Deployment Summary
        if: always()
        run: |
          echo "### 🚀 DEV Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Development |" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ secrets.DEV_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | http://${{ secrets.DEV_HOST }}:5000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.health.outputs.success == 'true' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # STAGE 3: Deploy to PRODUCTION (Auto after DEV success)
  # ==========================================
  deploy-production:
    name: 🚀 Deploy to PRODUCTION
    needs: [build-and-test, deploy-dev]
    runs-on: ubuntu-latest
    if: |
      needs.deploy-dev.outputs.deploy_success == 'true' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://platform.codebegun.com
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🗄️ Backup PRODUCTION Database
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ secrets.PROD_HOST }} << 'BACKUP'
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DB_BACKUP_DIR="/root/lms-backups/database"
          mkdir -p "$DB_BACKUP_DIR"
          
          if docker ps | grep -q "lms-mongodb"; then
            echo "📦 Backing up PRODUCTION database..."
            docker exec lms-mongodb mongodump \
              --uri="mongodb://admin:password123@localhost:27017/lms-saas?authSource=admin" \
              --out="/data/backup_$TIMESTAMP" \
              --gzip 2>/dev/null || true
            
            docker cp lms-mongodb:/data/backup_$TIMESTAMP "$DB_BACKUP_DIR/prod_backup_$TIMESTAMP" 2>/dev/null || true
            docker exec lms-mongodb rm -rf "/data/backup_$TIMESTAMP" 2>/dev/null || true
            
            if [ -d "$DB_BACKUP_DIR/prod_backup_$TIMESTAMP" ]; then
              cd "$DB_BACKUP_DIR"
              tar -czf "prod_backup_$TIMESTAMP.tar.gz" "prod_backup_$TIMESTAMP"
              rm -rf "prod_backup_$TIMESTAMP"
              echo "$TIMESTAMP" > "$DB_BACKUP_DIR/latest-prod"
              ls -t prod_*.tar.gz 2>/dev/null | tail -n +11 | xargs -r rm -f
              echo "✅ PRODUCTION database backed up"
            fi
          fi
          
          BACKUP

      - name: 🚀 Deploy to PRODUCTION
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ secrets.PROD_HOST }} << 'DEPLOY'
          
          set -e
          APP_DIR="${{ env.PROD_APP_PATH }}"
          BACKUP_DIR="/root/lms-backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          cd "$APP_DIR"
          
          # Preserve .env
          if [ -f "server/.env" ]; then
            cp "server/.env" "/tmp/.env.prod.safe"
            mkdir -p "$BACKUP_DIR/backup_$TIMESTAMP"
            cp "server/.env" "$BACKUP_DIR/backup_$TIMESTAMP/.env"
          fi
          
          # Pull latest code
          git stash 2>/dev/null || true
          git pull origin ${{ github.ref_name }}
          
          # Restore .env
          if [ -f "/tmp/.env.prod.safe" ]; then
            cp "/tmp/.env.prod.safe" "server/.env"
          fi
          
          # Build and deploy
          docker-compose down --timeout 30 2>/dev/null || true
          docker-compose build --no-cache
          docker-compose up -d
          
          echo "✅ PRODUCTION deployment complete"
          
          DEPLOY

      - name: ⏳ Wait for PRODUCTION startup
        run: sleep 30

      - name: 🔍 PRODUCTION Health Check
        id: health
        run: |
          MAX_RETRIES=10
          RETRY=0
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.PROD_HOST }}:5000/api/health" 2>/dev/null || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ PRODUCTION health check passed!"
              exit 0
            fi
            
            RETRY=$((RETRY + 1))
            echo "Attempt $RETRY/$MAX_RETRIES - HTTP $HTTP_STATUS"
            sleep 5
          done
          
          echo "❌ PRODUCTION health check failed! Initiating rollback..."
          exit 1

      - name: ⏪ Auto Rollback on Failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ secrets.PROD_HOST }} << 'ROLLBACK'
          
          APP_DIR="${{ env.PROD_APP_PATH }}"
          BACKUP_DIR="/root/lms-backups"
          
          echo "⏪ Rolling back PRODUCTION..."
          
          cd "$APP_DIR"
          
          # Restore .env from backup
          LATEST_BACKUP=$(ls -dt $BACKUP_DIR/backup_* 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ] && [ -f "$LATEST_BACKUP/.env" ]; then
            cp "$LATEST_BACKUP/.env" "server/.env"
          fi
          
          # Reset to previous commit
          git reset --hard HEAD~1
          
          # Rebuild and restart
          docker-compose build
          docker-compose up -d
          
          echo "✅ PRODUCTION rollback complete"
          
          ROLLBACK

      - name: 📊 PRODUCTION Deployment Summary
        if: always()
        run: |
          echo "### 🚀 PRODUCTION Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ secrets.PROD_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://platform.codebegun.com |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # MANUAL: Rollback Production
  # ==========================================
  rollback-production:
    name: ⏪ Rollback PRODUCTION
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'rollback-prod'
    environment:
      name: production
    
    steps:
      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: ⏪ Rollback PRODUCTION
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ secrets.PROD_HOST }} << 'ROLLBACK'
          
          APP_DIR="${{ env.PROD_APP_PATH }}"
          BACKUP_DIR="/root/lms-backups"
          DB_BACKUP_DIR="/root/lms-backups/database"
          
          echo "⏪ Rolling back PRODUCTION..."
          
          cd "$APP_DIR"
          
          # Restore .env
          LATEST_BACKUP=$(ls -dt $BACKUP_DIR/backup_* 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ] && [ -f "$LATEST_BACKUP/.env" ]; then
            cp "$LATEST_BACKUP/.env" "server/.env"
          fi
          
          # Reset to previous commit
          git reset --hard HEAD~1
          
          # Rebuild
          docker-compose down
          docker-compose build
          docker-compose up -d
          
          # Optionally restore database
          echo ""
          echo "Latest DB backup: $(cat $DB_BACKUP_DIR/latest-prod 2>/dev/null || echo 'None')"
          echo "To restore DB: ./scripts/restore-database.sh <backup_name>"
          
          echo "✅ PRODUCTION rollback complete"
          
          ROLLBACK

  # ==========================================
  # Notification
  # ==========================================
  notify:
    name: 📧 Notify
    needs: [build-and-test, deploy-dev, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Pipeline Summary
        run: |
          echo "### 📋 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy DEV | ${{ needs.deploy-dev.result == 'success' && '✅' || needs.deploy-dev.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy PROD | ${{ needs.deploy-production.result == 'success' && '✅' || needs.deploy-production.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
