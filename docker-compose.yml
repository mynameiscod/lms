services:
  mongodb:
    image: mongo:latest
    container_name: lms-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lms-saas
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    networks:
      - lms-network
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: lms-server
    ports:
      - "5000:5000"
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      NODE_ENV: production
      # Production URL for email links
      FRONTEND_URL: https://platform.codebegun.com
      # Code execution engine
      PISTON_URL: http://piston:2000/api/v2
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - piston
      - redis
    networks:
      - lms-network
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: lms-piston
    privileged: true
    tmpfs:
      - /piston/jobs:exec,size=256m
    volumes:
      - piston_data:/piston/packages
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  mongodb_data:
  uploads_data:
  piston_data:
  redis_data:

networks:
  lms-network:
    driver: bridge