name: codebegun-mcp-test

x-app: &app
  image: codebegun-mcp-test:local
  build:
    context: ../..
    dockerfile: ops/mcp-test/Dockerfile
  environment:
    MCP_STAGING_ONLY: synthetic-data-only
    NODE_OPTIONS: --max-old-space-size=768
  networks: [isolated]
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 128
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  mongo:
    image: mongo:7.0.24
    hostname: mcp-test-mongo
    entrypoint: [bash, /staging/mongo-start.sh]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mcp_test_admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo-data:/data/db
      - ./mongo-start.sh:/staging/mongo-start.sh:ro
    secrets: [mongo_keyfile, mongo_root_password]
    networks:
      isolated:
        aliases: [mcp-test-mongo]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 30

  prepare:
    <<: *app
    profiles: [tools]
    command: [node, ops/mcp-test/prepare.cjs]
    secrets: [mongo_root_password, mongo_app_password, test_password, oauth_clients]

  app:
    <<: *app
    ports: [127.0.0.1:5010:5000]
    secrets: [mongo_app_password, oauth_clients]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5000/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 12

  smoke:
    <<: *app
    profiles: [tools]
    command: [node, ops/mcp-test/smoke.cjs]
    secrets: [test_password]

  verify-db:
    <<: *app
    profiles: [tools]
    command: [node, ops/mcp-test/verify-db.cjs]
    secrets: [mongo_root_password, mongo_app_password, test_password]

networks:
  isolated:
    internal: true

volumes:
  mongo-data:

secrets:
  mongo_keyfile:
    file: ./private/mongo-keyfile
  mongo_root_password:
    file: ./private/mongo-root-password
  mongo_app_password:
    file: ./private/mongo-app-password
  test_password:
    file: ./private/test-password
  oauth_clients:
    file: ./private/clients.json
