version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lms-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lms-saas
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lms-server
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/lms-saas?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      NODE_ENV: production
      # Email Configuration
      EMAIL_SERVICE: gmail
      EMAIL_USER: infocodebegun@gmail.com
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-uawxhzufpxlonlsl}
      EMAIL_FROM: LMS Support <infocodebegun@gmail.com>
      # Production URL for email links
      FRONTEND_URL: http://187.124.97.56:3000
    depends_on:
      - mongodb
    networks:
      - lms-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lms-client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      - server
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  lms-network:
    driver: bridge